name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:REQUESTED_VERSION
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must have the form v1.2.3" }
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($tag -ne "v$version") { throw "Release tag must match Cargo.toml version ($version)" }
          "TAG=$tag" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Build installer
        run: ./scripts/package-installer.ps1 -Version $env:TAG
        shell: pwsh

      - name: Rename artifact
        run: |
          $src = "target\x86_64-pc-windows-msvc\release\windows-media-bar.exe"
          $dst = "windows-media-bar-${{ env.TAG }}-x86_64.exe"
          Copy-Item $src $dst
          echo "ARTIFACT=$dst" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.ARTIFACT }}
            target/installer/windows-media-bar-${{ env.TAG }}-x86_64-setup.exe
            target/installer/windows-media-bar-${{ env.TAG }}-x86_64-setup.exe.sha256
          generate_release_notes: true

[package]
name = "windows-media-bar"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "windows-media-bar"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "UI_ViewManagement",
    "Win32_System_Registry",
    "Win32_Graphics_Imaging",
    "Storage_Streams",
] }

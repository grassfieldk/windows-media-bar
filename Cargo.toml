[package]
name = "windows-media-bar"
version = "0.1.0"
edition = "2021"
description = "A lightweight Windows media control bar that docks to the bottom of your screen"
repository = "https://github.com/grassfieldk/windows-media-bar"
license = "MIT"

[[bin]]
name = "windows-media-bar"
path = "src/main.rs"

[build-dependencies]
winres     = "0.1"
resvg      = "0.44"
usvg       = "0.44"
tiny-skia  = "0.11"
ico        = "0.3"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "UI_ViewManagement",
    "Win32_System_Registry",
    "Win32_Graphics_Imaging",
    "Storage_Streams",
] }
